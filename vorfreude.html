<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GG Vorfreude-Radar</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
      margin: 0;
      padding: 1.5rem;
    }
    nav { margin-bottom: 1.5rem; font-size: 0.85rem; }
    nav a { color: #4fc3f7; text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    h1 { font-size: 1.2rem; margin-bottom: 0.25rem; }
    #vorfreude-subtitle {
      font-size: 0.85rem;
      color: #999;
      margin-bottom: 1rem;
    }
    #vorfreude-month-select {
      background: #222;
      color: #ccc;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 0.3rem 0.6rem;
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
      cursor: pointer;
    }
    #vorfreude-category-filter,
    #vorfreude-editor-filter {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }
    .filter-btn {
      padding: 0.3rem 0.8rem;
      border: 1px solid #555;
      border-radius: 4px;
      background: #222;
      color: #ccc;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .filter-btn.active {
      background: #4fc3f7;
      border-color: #4fc3f7;
      color: #111;
      font-weight: bold;
    }
    #vorfreude-chart-container {
      position: relative;
      max-width: 960px;
    }
    canvas { width: 100% !important; }
    #vorfreude-empty {
      color: #888;
      font-size: 0.9rem;
      margin-top: 1rem;
    }
    #vorfreude-csv-link {
      display: inline-block;
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #4fc3f7;
      text-decoration: none;
    }
    #vorfreude-csv-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <nav><a href="index.html">← Übersicht</a></nav>
  <h1>Vorfreude-Radar</h1>
  <p id="vorfreude-subtitle"></p>
  <select id="vorfreude-month-select"></select>
  <div id="vorfreude-category-filter"></div>
  <div id="vorfreude-editor-filter"></div>
  <div id="vorfreude-chart-container">
    <canvas id="vorfreude-chart"></canvas>
  </div>
  <p id="vorfreude-empty" style="display:none;"></p>
  <a id="vorfreude-csv-link" href="data/vorfreude.csv">CSV herunterladen</a>

  <script>
    const EDITOR_NAMES = {
      'editor:joerg_langer':    'Jörg Langer (Red.)',
      'editor:michael_trier':   'Michael Trier (Red.)',
      'editor:benjamin_braun':  'Benjamin Braun (Red.)',
      'editor:mark_wrba':       'Mark Wrba (Red.)',
      'editor:natalie_grosse':  'Natalie Grosse (Red.)',
      'editor:peter_bathge':    'Peter Bathge (Red.)',
      'editor:christoph_vent':  'Christoph Vent (Red.)',
    };

    function formatMentioner(key) {
      if (EDITOR_NAMES[key]) return EDITOR_NAMES[key];
      if (key.startsWith('editor:')) return key.slice(7).replace(/_/g, ' ') + ' (Red.)';
      if (key.startsWith('user:'))   return key.slice(5) + ' (User)';
      return key;
    }

    const CATEGORY_COLOR = {
      game:        '#4a90d9',
      film_series: '#e05c5c',
      misc:        '#6bbf6b',
      unknown:     '#aaa',
    };

    function categoryColor(cat) {
      return CATEGORY_COLOR[cat] || CATEGORY_COLOR.unknown;
    }

    let vorfreudeChartInstance = null;

    function renderVorfreudeChart(monthData, categoryFilter, sourceFilter) {
      const emptyEl  = document.getElementById('vorfreude-empty');
      const canvasEl = document.getElementById('vorfreude-chart');

      const stats = monthData.item_stats || {};
      const keys  = Object.keys(stats);

      if (keys.length === 0) {
        emptyEl.textContent = 'Noch keine Daten für diesen Monat.';
        emptyEl.style.display = 'block';
        if (vorfreudeChartInstance) { vorfreudeChartInstance.destroy(); vorfreudeChartInstance = null; }
        canvasEl.style.display = 'none';
        return;
      }

      const filtered = keys.filter(k => {
        const cat = stats[k].category || 'unknown';
        if (categoryFilter === 'games')  return cat === 'game';
        if (categoryFilter === 'films')  return cat === 'film_series';
        if (categoryFilter === 'misc')   return cat !== 'game' && cat !== 'film_series';
        return true;
      });

      const items = filtered.map(k => {
        const entry = stats[k];
        const mentioners = entry.mentioners || [];
        let count;
        if (sourceFilter === 'editors') {
          count = mentioners.filter(m => m.startsWith('editor:')).length;
        } else if (sourceFilter === 'users') {
          count = mentioners.filter(m => m.startsWith('user:')).length;
        } else {
          count = entry.count != null ? entry.count : mentioners.length;
        }
        return { name: k, count, category: entry.category || 'unknown', mentioners };
      }).filter(item => item.count > 0);

      items.sort((a, b) => b.count - a.count);
      const top = items.slice(0, 15);

      if (top.length === 0) {
        emptyEl.textContent = 'Noch keine Daten für diese Auswahl.';
        emptyEl.style.display = 'block';
        if (vorfreudeChartInstance) { vorfreudeChartInstance.destroy(); vorfreudeChartInstance = null; }
        canvasEl.style.display = 'none';
        return;
      }

      emptyEl.style.display = 'none';
      canvasEl.style.display = 'block';

      const labels     = top.map(i => i.name);
      const mentioners = top.map(i => i.mentioners);
      const stacked    = sourceFilter === 'all';

      let datasets;
      if (stacked) {
        datasets = [
          {
            label: 'Redakteure',
            data:            top.map(i => i.mentioners.filter(m => m.startsWith('editor:')).length),
            backgroundColor: top.map(i => categoryColor(i.category)),
            borderWidth: 0,
          },
          {
            label: 'User',
            data:            top.map(i => i.mentioners.filter(m => m.startsWith('user:')).length),
            backgroundColor: top.map(i => categoryColor(i.category) + '70'),
            borderWidth: 0,
          },
        ];
      } else {
        const colors = top.map(i => categoryColor(i.category));
        datasets = [{
          label: 'Nennungen',
          data:            top.map(i => i.count),
          backgroundColor: colors,
          borderColor:     colors.map(c => c + 'cc'),
          borderWidth: 1,
        }];
      }

      const chartData = { labels, datasets };

      const chartOptions = {
        indexAxis: 'y',
        responsive: true,
        plugins: {
          legend: { display: stacked, labels: { color: '#999', boxWidth: 14 } },
          tooltip: {
            callbacks: {
              afterLabel: (ctx) => {
                const all = mentioners[ctx.dataIndex];
                if (!all || all.length === 0) return '';
                const editors = all.filter(m => m.startsWith('editor:'));
                const userCount = all.filter(m => m.startsWith('user:')).length;
                const lines = editors.map(formatMentioner);
                if (userCount > 0) lines.push(`+${userCount} User`);
                return lines.join('\n');
              },
            },
          },
        },
        scales: {
          x: {
            stacked,
            ticks: { color: '#999' },
            grid:  { color: '#333' },
            title: { display: true, text: 'Nennungen', color: '#999' },
          },
          y: {
            stacked,
            ticks: { color: '#ccc', font: { size: 12 } },
            grid:  { color: '#333' },
          },
        },
      };

      if (vorfreudeChartInstance) vorfreudeChartInstance.destroy();
      vorfreudeChartInstance = new Chart(canvasEl, { type: 'bar', data: chartData, options: chartOptions });
    }

    async function main() {
      let months;
      try {
        months = await fetch('data/vorfreude.json').then(r => {
          if (!r.ok) throw new Error('not found');
          return r.json();
        });
      } catch (_) {
        document.body.innerHTML += '<p style="color:#888;">Vorfreude-Daten noch nicht vorhanden.</p>';
        return;
      }

      if (!months || months.length === 0) {
        document.body.innerHTML += '<p style="color:#888;">Vorfreude-Daten noch nicht vorhanden.</p>';
        return;
      }

      months.sort((a, b) => (b.month || '').localeCompare(a.month || ''));

      const yearMap = {};
      months.forEach(m => {
        const yr = m.month.slice(0, 4);
        if (!yearMap[yr]) yearMap[yr] = {};
        const stats = m.item_stats || {};
        Object.entries(stats).forEach(([title, s]) => {
          if (!yearMap[yr][title]) yearMap[yr][title] = { category: s.category, mentioners: new Set() };
          (s.mentioners || []).forEach(mn => yearMap[yr][title].mentioners.add(mn));
        });
      });
      const yearData = {};
      Object.entries(yearMap).forEach(([yr, items]) => {
        const finalStats = {};
        Object.entries(items).forEach(([title, s]) => {
          const arr = [...s.mentioners];
          finalStats[title] = { count: arr.length, category: s.category, mentioners: arr };
        });
        yearData[`year:${yr}`] = { month: `year:${yr}`, title: `${yr} – Ganzes Jahr`, item_stats: finalStats };
      });

      function lookupEntry(val) {
        if (val.startsWith('year:')) return yearData[val];
        return months.find(x => x.month === val);
      }

      let activeMonth          = months[0].month;
      let activeCategoryFilter = 'all';
      let sourceFilter         = 'all';

      const monthSelectEl = document.getElementById('vorfreude-month-select');
      let lastYear = null;
      months.forEach(m => {
        const yr = m.month.slice(0, 4);
        if (yr !== lastYear) {
          lastYear = yr;
          const yearOpt = document.createElement('option');
          yearOpt.value = `year:${yr}`;
          yearOpt.textContent = `${yr} – Ganzes Jahr`;
          monthSelectEl.appendChild(yearOpt);
        }
        const opt = document.createElement('option');
        opt.value = m.month;
        opt.textContent = m.month;
        if (m.month === activeMonth) opt.selected = true;
        monthSelectEl.appendChild(opt);
      });
      monthSelectEl.addEventListener('change', () => {
        activeMonth = monthSelectEl.value;
        const md = lookupEntry(activeMonth);
        document.getElementById('vorfreude-subtitle').textContent = md ? md.title : '';
        renderVorfreudeChart(md, activeCategoryFilter, sourceFilter);
      });

      document.getElementById('vorfreude-subtitle').textContent = lookupEntry(activeMonth)?.title || '';

      const categoryDefs = [
        { key: 'all',   label: 'Alle' },
        { key: 'games', label: 'Spiele' },
        { key: 'films', label: 'Filme & Serien' },
        { key: 'misc',  label: 'Sonstiges' },
      ];
      const catFilterEl = document.getElementById('vorfreude-category-filter');
      categoryDefs.forEach(def => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn' + (def.key === activeCategoryFilter ? ' active' : '');
        btn.textContent = def.label;
        btn.addEventListener('click', () => {
          document.querySelectorAll('#vorfreude-category-filter .filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeCategoryFilter = def.key;
          renderVorfreudeChart(lookupEntry(activeMonth), activeCategoryFilter, sourceFilter);
        });
        catFilterEl.appendChild(btn);
      });

      const sourceDefs = [
        { key: 'all',     label: 'Alle' },
        { key: 'editors', label: 'Nur Redakteure' },
        { key: 'users',   label: 'Nur User' },
      ];
      const editorFilterEl = document.getElementById('vorfreude-editor-filter');
      sourceDefs.forEach(def => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn' + (def.key === sourceFilter ? ' active' : '');
        btn.textContent = def.label;
        btn.addEventListener('click', () => {
          document.querySelectorAll('#vorfreude-editor-filter .filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          sourceFilter = def.key;
          renderVorfreudeChart(lookupEntry(activeMonth), activeCategoryFilter, sourceFilter);
        });
        editorFilterEl.appendChild(btn);
      });

      renderVorfreudeChart(lookupEntry(activeMonth), activeCategoryFilter, sourceFilter);
    }

    main();
  </script>
</body>
</html>
