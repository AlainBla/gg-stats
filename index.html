<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GamersGlobal Stats</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
      margin: 0;
      padding: 1.5rem;
    }
    h1 { font-size: 1.2rem; margin-bottom: 2rem; }
    .cards {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 1.5rem 2rem;
      text-decoration: none;
      color: #eee;
      width: 260px;
      transition: border-color 0.15s, background 0.15s;
    }
    .card:hover {
      border-color: #4fc3f7;
      background: #1f2a30;
    }
    .card h2 {
      font-size: 1rem;
      margin: 0 0 0.5rem;
      color: #4fc3f7;
    }
    .card p {
      font-size: 0.85rem;
      color: #999;
      margin: 0;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>GamersGlobal Stats</h1>
  <div class="cards">
    <a class="card" href="sonntagsfrage.html">
      <h2>Sonntagsfrage</h2>
      <p>Abstimmungsbeteiligung aller Sonntagsfrage-Umfragen seit 2014.</p>
    </a>
    <a class="card" href="vorfreude.html">
      <h2>Vorfreude-Radar</h2>
      <p>Welche Spiele, Filme und Serien die Redaktion und User in jedem Monat erwähnen.</p>
    </a>
  </div>
</body>
</html>
